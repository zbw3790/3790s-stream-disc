plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

group = 'com.zbw3790'
version = '0.1.0'
base { archivesName = '3790s-stream-disc' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'org.jcodec:jcodec:0.2.5'
    include 'org.jcodec:jcodec:0.2.5'
    ['fabric-api-base:2.0.4+ece063239e', 'fabric-networking-api-v1:6.3.3+72073ef09e', 'fabric-lifecycle-events-v1:4.1.3+4575b05f9e', 'fabric-registry-sync-v0:7.1.0+c7bd5b8e9e', 'fabric-resource-loader-v1:2.0.13+9edec1269e'].each {
        implementation "net.fabricmc.fabric-api:$it"
        include "net.fabricmc.fabric-api:$it"
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
test { useJUnitPlatform(); testLogging { showStandardStreams = true } }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version) } }
jar {
    archiveFileName = "3790s-stream-disc-${project.version}-mc26.2-fabric.jar"
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
    from('licenses/JCODEC-LICENSE.txt') { into 'licenses' }
}
